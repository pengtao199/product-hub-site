<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FyPix - Download on the App Store</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      .app-redirect {
        width: 100vw; height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fff; position: relative;
      }
      .top-right-container {
        position: absolute; top: 0; right: 20px;
        max-width: 320px; z-index: 1000;
      }
      .instruction {
        display: flex; flex-direction: column;
        align-items: flex-end; gap: 12px;
        margin-bottom: 20px;
      }
      .arrow-icon { font-size: 40px; color: #007AFF; font-weight: bold; line-height: 1; }
      .instruction-text { color: #333; line-height: 1.4; text-align: right; }
      .instruction-text p { margin: 0 0 6px 0; font-size: 16px; }
      .instruction-text strong { font-weight: 600; color: #007AFF; }
      .center-redirect {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column;
        align-items: center; gap: 15px;
      }
      .center-redirect p { font-size: 18px; color: #666; font-weight: 500; margin: 0; white-space: nowrap; }
      .loading-spinner {
        width: 24px; height: 24px;
        border: 3px solid #f3f3f3; border-top: 3px solid #007AFF;
        border-radius: 50%; animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @supports (padding: max(0px)) {
        .top-right-container {
          top: 0; right: max(20px, env(safe-area-inset-right) + 10px);
        }
      }
      @media (max-width: 375px) {
        .top-right-container { right: 15px; max-width: 280px; }
        .arrow-icon { font-size: 36px; }
        .instruction-text p { font-size: 15px; }
        .center-redirect p { font-size: 16px; }
        .loading-spinner { width: 20px; height: 20px; border: 2px solid #f3f3f3; border-top: 2px solid #007AFF; }
      }
    </style>
  </head>
  <body>
    <div class="app-redirect">
      <div class="top-right-container">
        <div class="instruction">
          <div class="arrow-icon">&#8593;</div>
          <div class="instruction-text">
            <p>If the page didn't open, tap here</p>
            <p>and choose <strong>"Open in browser"</strong></p>
          </div>
        </div>
      </div>

      <div class="center-redirect" id="loading">
        <p>Redirecting to App Store...</p>
        <div class="loading-spinner"></div>
      </div>
    </div>

    <script>
      (function () {
        var APP_STORE_URL = "https://apps.apple.com/app/fypix/id6749441709";
        window.location.href = APP_STORE_URL;
      })();
    </script>
  </body>
</html>
