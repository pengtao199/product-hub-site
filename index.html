<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelloCode</title>
    <meta name="description" content="HelloCode 的产品、博客和项目入口。" />
    <link rel="stylesheet" href="assets/styles.css?v=home" />
    <script src="assets/site-runtime.js" defer></script>
    <script src="assets/translate-runtime.js" defer></script>
    <script src="assets/home-typing.js" defer></script>
  </head>
  <body>
    <div class="home-shell">
      <header class="home-topbar" aria-label="站点顶部栏">
        <div class="home-topbar-inner">
          <div class="home-brand" data-no-translate>HelloCode</div>

          <nav class="home-nav" aria-label="主导航">
            <span>主页</span>
            <a href="projects/">项目</a>
            <a href="blog/">博客</a>
            <a href="about/">关于</a>
          </nav>

          <div class="home-actions" aria-label="站点设置">
            <button id="theme-toggle" class="home-action-button home-symbol-button notranslate" type="button" aria-label="切换深色模式" data-no-translate translate="no">☾</button>
            <button id="lang-toggle" class="home-action-button notranslate" type="button" aria-label="Switch to English" data-lang-label="EN" data-no-translate translate="no"></button>
          </div>
        </div>
      </header>

      <main class="home-main home-hero" aria-labelledby="home-title">
        <section class="terminal-hero">
          <h1 id="home-title" class="terminal-title notranslate" data-no-translate>
            <span>Hello</span><span id="typing-word">Code</span><span class="terminal-cursor" aria-hidden="true"></span>
          </h1>
          <p class="terminal-caption">独立开发者 · 产品 · 实验</p>
        </section>
      </main>

      <footer class="home-bottombar" aria-label="站点底部栏">
        <div class="home-bottombar-inner">
          <div class="home-footer-brand" data-no-translate>HelloCode</div>
          <p class="home-copyright">©2026 <span data-no-translate>HelloCode</span> 保留所有权利</p>
          <div class="home-symbols" aria-label="联系入口">
            <a class="footer-social-link" href="https://github.com/pengtao199" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.08 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.17.77.84 1.23 1.91 1.23 3.22 0 4.62-2.8 5.64-5.48 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z" /></svg>
            </a>
            <a class="footer-social-link" href="mailto:hello@hellocode.app" aria-label="Email">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h18v13H3z" fill="none" /><path d="m3.5 6.5 8.5 6 8.5-6M3 18.5h18" fill="none" /></svg>
            </a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
